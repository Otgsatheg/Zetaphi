name: Build Zetaphii APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          # If a zip is committed, unzip it; otherwise use the repo itself.
          ZIP_PATH="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -n "$ZIP_PATH" ]; then
            echo "Unzipping $ZIP_PATH"
            mkdir -p extracted
            unzip -q "$ZIP_PATH" -d extracted
            SEARCH_ROOT=extracted
          else
            SEARCH_ROOT=.
          fi

          # Pick the shallowest settings.gradle(.kts)
          SETTINGS="$(find "$SEARCH_ROOT" -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' -not -path '*/build/*' -not -path '*/__MACOSX/*' \
            | awk -F/ '{print NF, $0}' | sort -n | head -1 | cut -d' ' -f2-)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no settings.gradle(.kts) found. Files seen:"
            find "$SEARCH_ROOT" -maxdepth 3 -type f -not -path '*/.git/*' | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Show project info (for debugging)
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ls -la
          echo "== gradle-wrapper.properties =="
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "(none)"
          echo "== AGP / SDK / NDK hints =="
          grep -rnE "com\.android\.(application|library)|compileSdk|ndkVersion|externalNativeBuild|cmake" \
            --include=*.gradle --include=*.kts --include=*.toml . 2>/dev/null \
            | grep -v '/build/' | head -40 || true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Must be ONE line, space-separated (a multi-line list is read as a single package name)
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;25.1.8937393'

      # Only used to bootstrap a wrapper if the project lacks one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            # Keep the project's own Gradle version if it declares one.
            VER="$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' \
              gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -1)"
            VER="${VER:-8.9}"
            echo "Generating wrapper for Gradle $VER"

            # Generate in an empty temp dir so the project's build scripts
            # are NOT evaluated with the wrong Gradle version.
            TMP="$(mktemp -d)"
            touch "$TMP/settings.gradle"   # Gradle 8.9 refuses to run in a dir with no settings file
            (cd "$TMP" && gradle wrapper --gradle-version "$VER" --distribution-type bin)

            mkdir -p gradle/wrapper
            cp "$TMP/gradlew" "$TMP/gradlew.bat" .
            cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            [ -f gradle/wrapper/gradle-wrapper.properties ] || \
              cp "$TMP/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zetaphii-debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 3
